<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Ledger</title>
</head>
<body>
  <a href="/1">Ledger</a>
  <a href="/2">Accounts</a>
  <a href="/5">Income Statement</a>
  <a href="/6">Balance Sheet</a>

  <form action="/4" method="POST">
      <select required name="debit_account_id">
	      <option value="">Debit</option>
	      <!-- aso -->
	      %s
      </select>
      <select required name="credit_account_id">
	      <option value="">Credit</option>
	      <!-- aso -->
	      %s
      </select>
    <input name="note" required type="text" placeholder="Note"/>
    <input name="amount" required type="number" step="0.01" min="0.01" placeholder="USD 0.00"/>
    <button type="submit">Submit</button>
  </form>

  <table class="table table-striped">
   <thead>
     <th>ID</th>
     <th>Date/Time</th>
     <th>Debit Account</th>
     <th>Credit Account</th>
     <th>Note</th>
     <th>Amount</th>
   </thead>
   <tbody>
	   <!-- ln30: 30 newest entries -->
	   %s
   </tbody>
  </table>
</body>
</html>
